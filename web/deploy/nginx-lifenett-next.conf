# ─── Site em Next.js (fase 4 da migração, 2026-09-11) ───
# Páginas vêm do Next em 127.0.0.1:3100. Admin, API, imagens, uploads, /app e os
# HTMLs soltos continuam vindo do webroot PHP (/var/www/lifenett.com.br).
# Rollback = trocar este include pelo antigo `location / { try_files ... /index.php }`.

# index.php da raiz deixou de ser a home
location = /index.php { return 301 /; }

# Admin e API: PHP-FPM (nested pra o ^~ não engolir o .php)
location ^~ /admin/ {
    index index.php;
    try_files $uri $uri/ =404;
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
location ^~ /api/ {
    try_files $uri =404;
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# Estáticos do webroot (o admin grava logos/banners em img/ e uploads/)
location ^~ /img/     { try_files $uri =404; expires 7d; }  # sem add_header aqui: preservaria só o Cache-Control e apagaria HSTS/nosniff herdados
location ^~ /uploads/ { try_files $uri =404; expires 7d; }
location ^~ /app/     { try_files $uri $uri/ =404; }
location ~* \.html$   { try_files $uri =404; }

# Todo o resto: Next.js
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
