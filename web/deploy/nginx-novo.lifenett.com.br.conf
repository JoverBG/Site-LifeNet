server {
    server_name novo.lifenett.com.br;

    root /var/www/lifenett.com.br;
    index index.html;
    include snippets/wiki.conf;
    include snippets/app-api.conf;

    access_log /var/log/nginx/novo_access.log;
    error_log  /var/log/nginx/novo_error.log;

    server_tokens off;
    autoindex off;
    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # Ambiente de teste: não indexar
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~* \.(sqlite|sqlite3|db)$ { deny all; return 404; }
    location ~ /\.ht                   { deny all; return 404; }
    location ^~ /data/                 { deny all; return 404; }
    location ~ /\.(git|svn|hg|env|DS_Store) { deny all; return 404; }
    location = /api/db.php       { deny all; return 404; }
    location = /api/security.php { deny all; return 404; }
    location = /api/geo_helper.php { deny all; return 404; }
    location = /api/_json.php    { deny all; return 404; }
    location = /api/totp.php     { deny all; return 404; }
    location ~* ^/uploads/.*\.php$ { deny all; return 404; }

    location = /admin/login.php {
        limit_req zone=adminlogin burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    include snippets/lifenett-next.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/novo.lifenett.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/novo.lifenett.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = novo.lifenett.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name novo.lifenett.com.br;
    return 404; # managed by Certbot


}